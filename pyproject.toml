[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-mail"
version = "0.1.0"
description = "Reusable, configurable Microsoft Graph mailbox reader (messages + attachments)"
requires-python = ">=3.10"
dependencies = [
    "msal>=1.28",
    "requests>=2.31",
]

[tool.setuptools.packages.find]
where = ["src"]
